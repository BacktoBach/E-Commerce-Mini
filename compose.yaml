services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nightfood
      POSTGRES_USER: nightfood
      POSTGRES_PASSWORD: nightfood_dev_password
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    ports:
      - "5435:5432"
    volumes:
      - nightfood_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightfood -d nightfood"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

volumes:
  nightfood_postgres:
